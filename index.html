<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ujian Online — SMK CALM</title>

<!-- ============================================================

     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  /* Identitas SMK Ciledug Al-Musaddadiyah (CALM): navy elegan + aksen emas */
  --primary:#0b3d91; --primary-dark:#082a66; --primary-light:#eaf0fb;
  --primary-2:#123f9e; --navy-deep:#071d47;
  --gold:#d4a017; --gold-light:#fbeecb; --gold-dark:#a87a0c;
  --accent:var(--gold); --success:#0e9f6e; --danger:#dc2626; --warn:#d4a017;
  --bg:#f4f6fb; --card:#ffffff; --text:#152238; --muted:#5b6b8c; --border:#e3e8f4;
  --radius:18px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
h1,h2,h3{font-family:'Poppins',sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}
.container{padding:20px 18px 40px;flex:1;}
h1,h2,h3{margin:0 0 6px;letter-spacing:-.01em;}
h1{font-size:22px;} h2{font-size:19px;} h3{font-size:16px;}
p{color:var(--muted);line-height:1.55;margin:0 0 14px;}
.topbar{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,var(--navy-deep) 0%,var(--primary) 55%,var(--primary-2) 100%);color:#fff;padding:18px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(11,61,145,.28);position:relative;overflow:hidden;}
.topbar::after{content:"";position:absolute;top:-40%;right:-10%;width:160px;height:160px;background:radial-gradient(circle,rgba(212,160,23,.25),transparent 70%);pointer-events:none;}
.topbar h1{color:#fff;font-size:17px;margin:0;font-family:'Poppins',sans-serif;font-weight:700;}
.topbar .back{background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.topbar .back:active{background:rgba(255,255,255,.3);}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(11,61,145,.05);transition:box-shadow .2s,transform .15s;}
.card.tap{cursor:pointer;}
.card.tap:active{transform:scale(.98);}
.card.tap:hover{box-shadow:0 6px 20px rgba(11,61,145,.1);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:13px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s,box-shadow .2s;font-family:'Inter',sans-serif;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(120deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 14px rgba(11,61,145,.28);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(11,61,145,.38);}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary);}
.btn-outline:hover{background:var(--primary-light);}
.btn-danger{background:#fff;color:var(--danger);border:2px solid var(--danger);}
.btn-success{background:linear-gradient(120deg,var(--success),#0c8a5f);color:#fff;box-shadow:0 4px 14px rgba(14,159,110,.3);}
.btn-gold{background:linear-gradient(120deg,var(--gold),var(--gold-dark));color:#3a2a03;box-shadow:0 4px 14px rgba(212,160,23,.35);}
.btn-sm{padding:9px 12px;font-size:13px;width:auto;}
.btn[disabled]{opacity:.5;pointer-events:none;}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;margin-bottom:12px;background:#fbfcfe;color:var(--text);font-family:inherit;transition:border-color .15s,box-shadow .15s,background .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(11,61,145,.08);}
label{font-size:13px;font-weight:700;color:var(--primary);display:block;margin-bottom:6px;letter-spacing:.01em;}
.role-card{padding:30px 20px;text-align:center;border-radius:22px;position:relative;overflow:hidden;}
.role-card::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(11,61,145,.04),rgba(212,160,23,.05));opacity:0;transition:opacity .2s;}
.role-card:hover::before{opacity:1;}
.role-icon{margin-bottom:12px;display:flex;justify-content:center;filter:drop-shadow(0 4px 10px rgba(11,61,145,.18));}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;letter-spacing:.02em;}
.pill.gold{background:var(--gold-light);color:var(--gold-dark);}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.4px;}
.badge.ok{background:var(--gold-light);color:var(--gold-dark);}
.badge.warn{background:var(--primary-light);color:var(--primary);}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.muted{color:var(--muted);font-size:13px;}
.center{text-align:center;}
.q-nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;}
.q-dot{width:32px;height:32px;border-radius:9px;background:#eef1f8;color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.15s;cursor:pointer;}
.q-dot:hover{transform:translateY(-1px);}
.q-dot.answered{background:var(--gold-light);color:var(--gold-dark);}
.q-dot.current{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(11,61,145,.35);}
.option{display:flex;align-items:center;gap:12px;padding:15px;border:2px solid var(--border);border-radius:15px;margin-bottom:10px;cursor:pointer;transition:.18s;background:#fff;position:relative;overflow:hidden;}
.option:hover{border-color:#c7d3ec;}
.option:active{transform:scale(.98);}
.option.selected{border-color:var(--primary);background:var(--primary-light);box-shadow:0 3px 12px rgba(11,61,145,.12);}
.option .letter{width:32px;height:32px;border-radius:50%;background:var(--border);color:var(--text);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:.18s;}
.option.selected .letter{background:linear-gradient(120deg,var(--primary),var(--primary-2));color:#fff;transform:scale(1.08);}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:7px 14px;border-radius:11px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);}
.timer.low{background:#fff0f0;color:var(--danger);border-color:transparent;animation:pulseTimer 1s infinite;}
@keyframes pulseTimer{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.progressbar{height:9px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:18px;}
.progressbar > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));transition:width .35s cubic-bezier(.4,0,.2,1);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 6px;border-bottom:1px solid var(--border);text-align:left;}
th{color:var(--primary);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;}
tr:hover td{background:var(--primary-light);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:13px 22px;border-radius:14px;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(7,29,71,.35);max-width:90%;text-align:center;font-weight:500;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .icon{font-size:40px;margin-bottom:10px;}
.spin{width:34px;height:34px;border:3px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;margin:20px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.result-hero{text-align:center;padding:32px 20px;}
.result-score{font-size:60px;font-weight:800;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,var(--primary),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.qbuild{border:1.5px dashed var(--border);border-radius:15px;padding:14px;margin-bottom:12px;background:#fbfcfe;}
.qbuild .row-between{margin-bottom:8px;}
.link-x{color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;}
.code-box{background:linear-gradient(135deg,var(--primary-light),#fff);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden;}
.code-box .code{font-size:30px;font-weight:800;letter-spacing:5px;color:var(--primary);font-family:'Poppins',sans-serif;}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
.filters select{width:auto;margin:0;font-size:13px;padding:9px 12px;border-radius:10px;}
@keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fadein{animation:fadein .3s cubic-bezier(.4,0,.2,1);}
.brand-header{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:4px;}
.brand-header .school-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--primary);}
.brand-header .acc-badge{background:linear-gradient(120deg,var(--gold),var(--gold-dark));color:#3a2a03;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;letter-spacing:.3px;}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:999;}
.exam-wrap{background:radial-gradient(circle at 15% 0%,rgba(11,61,145,.04),transparent 45%),radial-gradient(circle at 100% 30%,rgba(212,160,23,.045),transparent 40%);flex:1;}
.qcounter{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--primary);}
.q-card{border:1px solid var(--border);position:relative;padding-top:22px;}
.q-card::before{content:"";position:absolute;top:0;left:22px;right:22px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--gold),var(--primary));}
.q-badge{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(11,61,145,.25);}
.flag-btn{background:var(--gold-light);border:1.5px solid transparent;color:var(--gold-dark);width:36px;height:36px;border-radius:11px;font-size:18px;cursor:pointer;transition:.15s;}
.flag-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;box-shadow:0 4px 12px rgba(212,160,23,.35);}
.flag-btn:active{transform:scale(.9);}
.q-dot{position:relative;}
.q-dot.flagged::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:1.5px solid #fff;}
.result-card-preview{border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(11,61,145,.15);margin-bottom:14px;max-width:100%;display:block;}
.modal-overlay{position:fixed;inset:0;background:rgba(7,29,71,.72);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;backdrop-filter:blur(3px);}
.modal-card{background:#fff;border-radius:22px;padding:32px 26px;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal-quote-icon{font-size:46px;color:var(--gold);font-family:Georgia,serif;line-height:1;margin-bottom:6px;}
.modal-quote-text{font-family:'Poppins',sans-serif;font-size:16px;font-weight:600;color:var(--primary);line-height:1.6;margin-bottom:20px;}
.faq-card{max-width:440px;text-align:left;max-height:80vh;display:flex;flex-direction:column;}
.faq-list{overflow-y:auto;padding-right:4px;}
.faq-item{border-bottom:1px solid var(--border);padding:12px 0;}
.faq-item:last-child{border-bottom:none;}
.faq-q{font-weight:700;color:var(--primary);font-size:14px;margin-bottom:5px;}
.faq-a{font-size:13.5px;color:var(--muted);line-height:1.55;}
.tatib-card{border:1.5px solid var(--gold-light);background:linear-gradient(160deg,#fffdf6,#fff);}
.tatib-list{margin:0 0 14px;padding-left:18px;color:var(--text);font-size:13.5px;line-height:1.7;}
.tatib-list li{margin-bottom:6px;}
.tatib-quote{background:var(--primary-light);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 14px;font-size:13px;color:var(--primary);font-style:italic;line-height:1.6;margin-bottom:14px;}
.tatib-check{display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;}
.camera-box{width:100%;max-width:280px;aspect-ratio:1/1;margin:0 auto 6px;border-radius:20px;overflow:hidden;background:var(--navy-deep);border:3px solid var(--gold);position:relative;}
.camera-box video, .camera-box img{width:100%;height:100%;object-fit:cover;}
.photo-thumb{width:36px;height:36px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid var(--gold);}
.photo-thumb-placeholder{width:36px;height:36px;border-radius:50%;background:var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);}
@keyframes qSlideIn{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:translateX(0);}}
.q-transition{animation:qSlideIn .28s cubic-bezier(.4,0,.2,1);}
@keyframes screenFlash{
  0%,100%{box-shadow:inset 0 0 0 0 rgba(212,160,23,0);}
  50%{box-shadow:inset 0 0 55px 10px rgba(212,160,23,.22);}
}
body.time-critical{animation:screenFlash 1.6s ease-in-out infinite;}
.time-banner{display:none;text-align:center;background:linear-gradient(120deg,#b91c1c,#7f1d1d);color:#fff;font-weight:700;font-size:13px;padding:9px;border-radius:11px;margin-bottom:12px;}
body.time-critical .time-banner{display:block;animation:bannerFade 1.6s ease-in-out infinite;}
@keyframes bannerFade{0%,100%{opacity:1;}50%{opacity:.75;}}
</style>

<script>
/* ============================================================
   1) KONFIGURASI FIREBASE — WAJIB DIISI SEBELUM DIPAKAI
   ============================================================

   5. (Opsional tapi disarankan) Setelah beberapa hari, ganti rules di
      Firestore -> Rules dengan aturan yang lebih aman, contoh ada di
      bagian bawah file ini (lihat komentar CONTOH RULES).
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyD1Hl6fxEC1OxpDUy1lq8Vsxg2v4SO1w2w",
  authDomain: "ujian-sekolah-smks-calm.firebaseapp.com",
  projectId: "ujian-sekolah-smks-calm",
  storageBucket: "ujian-sekolah-smks-calm.firebasestorage.app",
  messagingSenderId: "944891916966",
  appId: "1:944891916966:web:43b66faeda65fec627ba67"
};

// Kata sandi guru untuk masuk ke dashboard (silakan ganti)
const TEACHER_PASSCODE = "guru123";

/* ============================================================
   FIRESTORE SECURITY RULES (disarankan, jangan pakai mode "test" terus)
   Tempel di Firebase Console -> Firestore Database -> Rules -> Publish.
   Lihat versi lengkap & penjelasannya di percakapan tempat file ini dibuat;
   inti aturannya: exams & results hanya bisa dibuat (create), tidak bisa
   diubah/dihapus dari aplikasi publik, dan field periode dibatasi ke
   'UTS' / 'UAS' saja.
============================================================ */

let db = null, firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebaseReady = true;
}catch(e){ console.error("Firebase init error", e); }

/* ============================================================
   2) STATE & ROUTER
   ============================================================ */
const state = {
  view: "home",
  role: null,
  examDraft: null,      // exam being built by teacher
  currentExam: null,    // exam loaded by student
  studentInfo: null,
  answers: {},
  qIndex: 0,
  timerEnd: null,
  timerInterval: null,
  examList: [],
  recapExam: null,
  recapResults: [],
  recapFilter: { kelas: "", jurusan: "" }
};

function nav(view, extra){ state.view = view; if(extra) Object.assign(state, extra); render(); }
function toast(msg, ms=2400){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}
const WISDOM_QUOTES = [
  "Nilai hari ini bukan penentu masa depanmu, tapi kerja keras yang konsisten yang akan membawamu ke sana.",
  "Setiap usaha yang sungguh-sungguh tidak pernah sia-sia, meski hasilnya belum terlihat sekarang.",
  "Kegagalan hanyalah jeda sebelum keberhasilan, bukan akhir dari perjalanan.",
  "Ilmu yang bermanfaat adalah ilmu yang diamalkan, bukan sekadar dihafal untuk ujian.",
  "Jangan bandingkan dirimu dengan orang lain, bandingkan dirimu hari ini dengan dirimu kemarin.",
  "Proses belajar yang jujur lebih berharga daripada nilai sempurna yang didapat dengan curang.",
  "Kesulitan yang kamu hadapi hari ini sedang membentuk kekuatan yang kamu butuhkan esok hari.",
  "Terus melangkah walau pelan, karena berhenti sama sekali tidak akan membawamu ke mana pun.",
  "Kejujuran dalam belajar adalah pondasi karakter yang akan kamu bawa seumur hidup.",
  "Semangat belajar hari ini adalah investasi terbaik untuk masa depanmu."
];
function randomQuote(){ return WISDOM_QUOTES[Math.floor(Math.random()*WISDOM_QUOTES.length)]; }

function fireConfetti(){
  let canvas = document.getElementById("confetti-canvas");
  if(!canvas){
    canvas = document.createElement("canvas");
    canvas.id = "confetti-canvas";
    document.body.appendChild(canvas);
  }
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#0b3d91","#d4a017","#fbeecb","#123f9e","#ffffff"];
  const pieces = Array.from({length:70}, ()=>({
    x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.3,
    r: 4+Math.random()*5, c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2+Math.random()*3, vx: -1.5+Math.random()*3, rot: Math.random()*360, vr: -6+Math.random()*12
  }));
  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      ctx.restore();
    });
    if(frame < 110) requestAnimationFrame(tick);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.remove(); }
  }
  tick();
}
function genCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c=""; for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ============================================================
   3) TOP BAR
   ============================================================ */
function topbar(title, onBack, faqType){
  return `<div class="topbar">
    ${onBack ? `<button class="back" onclick="${onBack}">←</button>` : ""}
    <h1 style="flex:1">${esc(title)}</h1>
    ${faqType ? `<button class="back" onclick="openFAQ('${faqType}')" title="Bantuan">?</button>` : ""}
  </div>`;
}

/* ============================================================
   4) VIEW: HOME (pilih peran)
   ============================================================ */
function viewHome(){
  return `
  ${topbar("Ujian Online")}
  <div class="container fadein">
    <div class="brand-header" style="margin-top:6px">
      <span class="school-name">SMKS Ciledug Al-Musaddadiyah</span>
      <span class="acc-badge">AKREDITASI A</span>
    </div>
    <p class="center" style="margin-top:2px">Pilih peran Anda untuk melanjutkan.</p>
    <div class="grid2">
      <div class="card tap role-card" onclick="nav('teacherLogin')">
        <div class="role-icon">
          <svg width="46" height="46" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="23" fill="url(#gGuru)"/>

function removeQuestion(i){ state.examDraft.questions.splice(i,1); render(); }

function downloadTemplate(){
  const wsData = [
    ["Soal","PilihanA","PilihanB","PilihanC","PilihanD","JawabanBenar"],
    ["Ibukota Indonesia adalah?","Jakarta","Bandung","Surabaya","Medan","A"]
  ];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Soal");
  XLSX.writeFile(wb, "template_soal_ujian.xlsx");
}
function importExcel(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      let added = 0;
      rows.forEach(r=>{
        const soal = r.Soal || r.soal || "";
        if(!soal) return;
        state.examDraft.questions.push({
          soal: String(soal),
          options:{
            A: String(r.PilihanA ?? r.pilihanA ?? ""),
            B: String(r.PilihanB ?? r.pilihanB ?? ""),
            C: String(r.PilihanC ?? r.pilihanC ?? ""),
            D: String(r.PilihanD ?? r.pilihanD ?? "")
          },
          correct: String(r.JawabanBenar ?? r.jawabanBenar ?? "A").trim().toUpperCase().charAt(0) || "A"
        });
        added++;
      });
      toast(`${added} soal berhasil diimpor`);
      render();
    }catch(err){ console.error(err); toast("Gagal membaca file. Pastikan format sesuai template."); }
  };
  reader.readAsArrayBuffer(file);
}

function viewRecap(){
  const ex = state.recapExam;
  let results = state.recapResults;
  const kelasList = [...new Set(results.map(r=>r.kelas).filter(Boolean))];
  const jurusanList = [...new Set(results.map(r=>r.jurusan).filter(Boolean))];
  const f = state.recapFilter;
  const filtered = results.filter(r => (!f.kelas || r.kelas===f.kelas) && (!f.jurusan || r.jurusan===f.jurusan));
  const avg = filtered.length ? (filtered.reduce((s,r)=>s+r.score,0)/filtered.length).toFixed(1) : "-";
  const max = filtered.length ? Math.max(...filtered.map(r=>r.score)) : "-";
  const min = filtered.length ? Math.min(...filtered.map(r=>r.score)) : "-";

  return `
  ${topbar("Rekap Hasil", "nav('teacherDash')", "guru")}
  <div class="container fadein">
    <div class="card">
      <h3>${esc(ex.title)}</h3>

          <div><div style="font-size:22px;font-weight:800;color:var(--primary)">${avg}</div><div class="muted">Rata-rata</div></div>
        </div>
      </div>
      <p class="muted">Tertinggi: <b>${max}</b> · Terendah: <b>${min}</b></p>
    </div>

    <div class="filters">
      <select onchange="state.recapFilter.kelas=this.value;render()">
        <option value="">Semua Kelas</option>
        ${kelasList.map(k=>`<option value="${esc(k)}" ${f.kelas===k?"selected":""}>${esc(k)}</option>`).join("")}
      </select>
      <select onchange="state.recapFilter.jurusan=this.value;render()">
        <option value="">Semua Jurusan</option>
        ${jurusanList.map(j=>`<option value="${esc(j)}" ${f.jurusan===j?"selected":""}>${esc(j)}</option>`).join("")}
      </select>
    </div>

    <button class="btn btn-outline" onclick="exportRecap()">⬇ Export ke Excel</button>
    <div style="height:12px"></div>

    ${filtered.length===0 ? `<div class="empty"><div class="icon">🕒</div>Belum ada siswa yang mengumpulkan</div>` : `
    <div class="card" style="overflow-x:auto">
      <table>
        <tr><th>Foto</th><th>Nama</th><th>JK</th><th>Kelas</th><th>Jurusan</th><th>Nilai</th><th>Pelanggaran</th></tr>
        ${filtered.map(r=>`<tr>
          <td>${r.foto ? `<img class="photo-thumb" src="${r.foto}" onclick="openPhotoModal('${r.id}')">` : `<span class="photo-thumb-placeholder">?</span>`}</td>
          <td>${esc(r.nama)}</td><td>${r.gender==='Laki-laki'?'L':r.gender==='Perempuan'?'P':'-'}</td><td>${esc(r.kelas)}</td><td>${esc(r.jurusan)}</td><td><b>${r.score}</b></td><td>${r.violations ? `<span style="color:var(--danger);font-weight:700">${r.violations}x</span>` : '<span class="muted">-</span>'}</td></tr>`).join("")}
      </table>
    </div>`}
  </div>`;
}
function exportRecap(){
  const ex = state.recapExam;
  const f = state.recapFilter;
  const filtered = state.recapResults.filter(r => (!f.kelas || r.kelas===f.kelas) && (!f.jurusan || r.jurusan===f.jurusan));
  const data = filtered.map(r=>({
    Nama:r.nama, JenisKelamin:r.gender||"", TempatTanggalLahir:r.ttl||"",
    Kelas:r.kelas, Jurusan:r.jurusan, ProgramStudi:r.prodi||"",
    Nilai:r.score, BenarBenar:r.correctCount, TotalSoal:r.total, Pelanggaran:r.violations||0,
    WaktuPelaksanaan:r.waktuUjian||""
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rekap");
  XLSX.writeFile(wb, `rekap_${(ex.title||"ujian").replace(/[^a-z0-9]/gi,"_")}.xlsx`);
}

      <p class="muted" id="camStatus" style="margin-top:10px">${state.capturedPhoto ? "Foto tersimpan, periksa sekali lagi sebelum lanjut." : "Memuat kamera..."}</p>
      ${!state.capturedPhoto ? `
        <button class="btn btn-primary" onclick="capturePhoto()">📸 Ambil Foto</button>
        <div style="height:8px"></div>
        <button class="btn btn-outline btn-sm" onclick="skipPhoto()">Lewati (kamera tidak tersedia)</button>
      ` : `
        <div class="grid2">
          <button class="btn btn-outline" onclick="retakePhoto()">↺ Ambil Ulang</button>
          <button class="btn btn-success" onclick="beginExam()">✓ Mulai Ujian</button>
        </div>
      `}
    </div>
  </div>`;
}
async function initCamera(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:false});
    const video = document.getElementById("camVideo");
    if(video) video.srcObject = camStream;
    const st = document.getElementById("camStatus");
    if(st) st.textContent = "Posisikan wajah di tengah bingkai, lalu ambil foto.";
  }catch(e){
    console.error(e);
    const st = document.getElementById("camStatus");
    if(st) st.textContent = "⚠ Kamera tidak dapat diakses (izin ditolak atau tidak tersedia). Anda bisa melewati langkah ini.";
  }
}
function stopCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
}
function backFromPhoto(){ stopCamera(); nav("studentInfo"); }
function capturePhoto(){
  const video = document.getElementById("camVideo");
  if(!video || !video.videoWidth) return toast("Kamera belum siap, coba lagi sebentar");
  const canvas = document.getElementById("camCanvas");
  const size = 380;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(size/vw, size/vh);
  const sw = size/scale, sh = size/scale;
  const sx = (vw-sw)/2, sy = (vh-sh)/2;
  ctx.save();
  ctx.translate(size,0); ctx.scale(-1,1);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, size, size);
  ctx.restore();
  state.capturedPhoto = canvas.toDataURL("image/jpeg", 0.6);
  stopCamera();
  render();
}
function retakePhoto(){ state.capturedPhoto = null; render(); }
function skipPhoto(){ state.capturedPhoto = null; stopCamera(); beginExam(); }
function beginExam(){
  state.studentInfo = {...state.pendingStudentInfo, foto: state.capturedPhoto || null};
  state.answers = {};
  state.flagged = {};
  state.violations = 0;
  state.qIndex = 0;
  const durMs = (state.currentExam.duration||30)*60*1000;
  state.timerEnd = Date.now() + durMs;
  nav("exam");
  startTimer();
  attachAntiCheat();
}

/* ============================================================
   10) VIEW: EXAM (siswa mengerjakan)
   ============================================================ */
let lastViolationTime = 0;
function markViolation(){
  const now = Date.now();
  if(now - lastViolationTime < 1000) return;
  lastViolationTime = now;
  state.violations = (state.violations||0) + 1;
}
function handleVisibilityChange(){
  if(document.hidden){
    markViolation();
  } else if(state.violations > 0 && state.view === "exam"){
    setTimeout(()=>{
      alert(`⚠️ PERINGATAN UJIAN\n\nAnda terdeteksi keluar dari halaman ujian (${state.violations}x).\n\nTindakan ini tercatat otomatis dan akan dilaporkan ke guru. Mohon fokus dan tetap berada di halaman ujian sampai selesai.`);
    }, 200);
  }
}
function handleWindowBlur(){
  if(state.view === "exam") markViolation();
}
function attachAntiCheat(){
  document.addEventListener("visibilitychange", handleVisibilityChange);
  window.addEventListener("blur", handleWindowBlur);
}
function detachAntiCheat(){
  document.removeEventListener("visibilitychange", handleVisibilityChange);
  window.removeEventListener("blur", handleWindowBlur);
}

function startTimer(){
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(()=>{
    const left = state.timerEnd - Date.now();
    if(left<=0){ clearInterval(state.timerInterval); document.body.classList.remove("time-critical"); toast("Waktu habis, ujian dikumpulkan otomatis"); submitExam(); return; }
    const el = document.getElementById("timerDisplay");
    if(el){
      const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
      el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      el.className = "timer" + (left < 60000 ? " low" : "");
    }
    if(left <= 60000) document.body.classList.add("time-critical");
    else document.body.classList.remove("time-critical");
  }, 1000);
}
function viewExam(){
  const ex = state.currentExam;
  const qs = ex.questions;
  const i = state.qIndex;
  const q = qs[i];
  const answeredCount = Object.keys(state.answers).length;
  const isFlagged = !!state.flagged[i];
  const animClass = state.qAnim ? "q-transition" : "";
  state.qAnim = false;
  return `
  <div class="topbar">
    <h1 style="flex:1;font-size:15px;opacity:.92">${esc(ex.title)}</h1>
    <span class="timer" id="timerDisplay">--:--</span>
    <button class="back" onclick="openFAQ('siswa')" title="Bantuan">?</button>
  </div>
  <div class="exam-wrap">
  <div class="container" key="${i}">
    <div class="time-banner">⏰ Waktu hampir habis! Segera selesaikan dan kumpulkan jawaban Anda.</div>
    <div class="row-between" style="margin-bottom:8px">
      <span class="qcounter">Soal <b>${i+1}</b> <span class="muted">/ ${qs.length}</span></span>
      <span class="muted" style="font-size:12px">${answeredCount} terjawab</span>
    </div>
    <div class="progressbar"><div style="width:${((i+1)/qs.length*100)}%"></div></div>

    <div class="card q-card ${animClass}">
      <div class="row-between" style="align-items:flex-start;margin-bottom:12px">
        <div class="q-badge">${i+1}</div>
        <button class="flag-btn ${isFlagged?'active':''}" onclick="toggleFlag(${i})" title="Tandai untuk ditinjau">${isFlagged?'★':'☆'}</button>
      </div>
      <h3 style="font-size:17px;line-height:1.5;font-weight:600">${esc(q.soal)}</h3>
      <div style="margin-top:14px">
      ${["A","B","C","D"].filter(L=>q.options[L]).map(L=>`
        <div class="option ${state.answers[i]===L?'selected':''}" onclick="selectAnswer(${i},'${L}')">
          <div class="letter">${L}</div>
          <div>${esc(q.options[L])}</div>
        </div>
      `).join("")}
      </div>
    </div>

    <div class="q-nav">
      ${qs.map((_,idx)=>`<div class="q-dot ${idx===i?'current':(state.answers[idx]?'answered':'')} ${state.flagged[idx]?'flagged':''}" onclick="goToQuestion(${idx})">${idx+1}</div>`).join("")}
    </div>

    <div class="grid2">
      <button class="btn btn-outline" ${i===0?"disabled":""} onclick="goToQuestion(${i-1})">← Sebelumnya</button>
      ${i<qs.length-1 ?
        `<button class="btn btn-primary" onclick="goToQuestion(${i+1})">Selanjutnya →</button>` :
        `<button class="btn btn-success" onclick="confirmSubmit()">✓ Kumpulkan</button>`
      }
    </div>
  </div>
  </div>`;
}
function goToQuestion(idx){ state.qIndex = idx; state.qAnim = true; render(); startTimer(); }
const FAQ_GURU = [
  {q:"Bagaimana cara membuat ujian baru?", a:"Di Dashboard Guru, klik \"+ Buat Ujian Baru\", isi judul, periode (UTS/UAS), kelas, jurusan, dan durasi, lalu tambahkan soal manual atau impor dari Excel."},
  {q:"Bagaimana cara mengimpor soal dari Excel?", a:"Unduh template Excel di halaman Buat Ujian, isi sesuai kolom yang tersedia (Soal, PilihanA-D, JawabanBenar), lalu unggah kembali file tersebut."},
  {q:"Kenapa saya tidak bisa mengedit atau menghapus ujian dari aplikasi?", a:"Ini sengaja dikunci demi keamanan data — supaya soal dan nilai siswa tidak bisa diubah sembarangan. Untuk hapus, gunakan Firebase Console."},
  {q:"Bagaimana cara melihat rekap nilai siswa?", a:"Klik salah satu ujian di Dashboard Guru untuk membuka halaman Rekap Hasil, lengkap dengan filter kelas/jurusan dan tombol export ke Excel."},
  {q:"Kode ujian saya hilang, bagaimana cara melihatnya lagi?", a:"Kode ujian selalu ditampilkan sebagai pill di samping judul ujian pada daftar Dashboard Guru."},
  {q:"Apakah aman jika kata sandi guru diketahui orang lain?", a:"Segera ganti TEACHER_PASSCODE di dalam file HTML dan upload ulang, karena kata sandi ini yang membatasi akses ke fitur pembuatan ujian."}
];
const FAQ_SISWA = [
  {q:"Kode ujian saya tidak ditemukan, kenapa?", a:"Pastikan kode diketik persis 6 karakter tanpa spasi. Jika masih gagal, tanyakan ke guru apakah ujian sudah dibuat/aktif."},
  {q:"Bolehkah saya keluar dari halaman ujian sebentar?", a:"Sebaiknya tidak. Sistem mendeteksi jika Anda pindah tab/aplikasi lain, dan pelanggaran akan tercatat serta dilaporkan ke guru."},
  {q:"Apa fungsi tombol bintang (⭐) di soal?", a:"Untuk menandai soal yang masih ragu-ragu, supaya mudah ditemukan lagi sebelum mengumpulkan jawaban."},
  {q:"Bagaimana jika waktu habis sebelum saya selesai?", a:"Jawaban yang sudah dipilih akan otomatis terkumpul saat waktu mencapai 00:00, jadi pastikan menjawab soal penting lebih dulu."},
  {q:"Bisakah saya mengulang ujian yang sudah dikumpulkan?", a:"Tidak bisa. Sistem hanya mengizinkan satu kali pengumpulan untuk setiap nama pada ujian yang sama."},
  {q:"Bagaimana cara menyimpan hasil ujian saya?", a:"Setelah selesai, klik tombol \"Unduh Hasil Ujian\" di layar hasil untuk mengunduh kartu hasil sebagai gambar."}
];
function openPhotoModal(resultId){
  const r = state.recapResults.find(x=>x.id===resultId);
  if(!r || !r.foto) return;
  state.photoModal = {url:r.foto, nama:r.nama};
  render();
}
function closePhotoModal(){ state.photoModal = null; render(); }
function renderPhotoModal(){
  if(!state.photoModal) return "";
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closePhotoModal()">
    <div class="modal-card" style="max-width:340px">
      <h3 style="margin-bottom:12px">${esc(state.photoModal.nama)}</h3>
      <img src="${state.photoModal.url}" style="width:100%;border-radius:16px;border:3px solid var(--gold);margin-bottom:14px">
      <button class="btn btn-primary" onclick="closePhotoModal()">Tutup</button>
    </div>
  </div>`;
}

function openFAQ(type){ state.faqOpen = true; state.faqType = type; render(); }
function closeFAQ(){ state.faqOpen = false; render(); }
function renderFAQModal(){
  if(!state.faqOpen) return "";
  const items = state.faqType === "guru" ? FAQ_GURU : FAQ_SISWA;
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeFAQ()">
    <div class="modal-card faq-card">
      <div class="row-between" style="margin-bottom:10px">
        <h3 style="margin:0">❓ Pertanyaan Umum</h3>
        <button class="back" style="background:var(--primary-light);color:var(--primary)" onclick="closeFAQ()">✕</button>
      </div>
      <div class="faq-list">
        ${items.map(f=>`
          <div class="faq-item">
            <div class="faq-q">${esc(f.q)}</div>
            <div class="faq-a">${esc(f.a)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  </div>`;
}

function toggleFlag(i){ state.flagged[i] = !state.flagged[i]; render(); startTimer(); }
function selectAnswer(i, letter){ state.answers[i] = letter; render(); startTimer(); }
function confirmSubmit(){
  const total = state.currentExam.questions.length;
  const answered = Object.keys(state.answers).length;
  const flaggedCount = Object.values(state.flagged||{}).filter(Boolean).length;
  let msg = "Kumpulkan jawaban sekarang?";
  if(answered < total) msg = `Masih ada ${total-answered} soal belum dijawab. Tetap kumpulkan?`;
  else if(flaggedCount > 0) msg = `Anda masih menandai ${flaggedCount} soal untuk ditinjau. Tetap kumpulkan?`;
  if(confirm(msg)) submitExam();
}
async function submitExam(){
  clearInterval(state.timerInterval);
  detachAntiCheat();
  document.body.classList.remove("time-critical");
  const ex = state.currentExam;
  let correct = 0;
  ex.questions.forEach((q,i)=>{ if(state.answers[i] === q.correct) correct++; });
  const total = ex.questions.length;
  const score = total ? Math.round((correct/total)*100) : 0;
  const payload = {
    ...state.studentInfo, score, correctCount: correct, total,
    violations: state.violations||0,
    answers: state.answers, submittedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try{
    if(firebaseReady) await db.collection("exams").doc(ex.id).collection("results").add(payload);
    const lockKey = `ujian_done_${ex.id}_${state.studentInfo.nama.toLowerCase()}`;
    localStorage.setItem(lockKey, "1");
  }catch(e){ console.error(e); toast("Gagal mengirim, periksa koneksi internet"); }
  nav("studentResult", {finalScore:score, finalCorrect:correct, finalTotal:total, quoteText:randomQuote(), showQuoteModal:true});
  if(score >= 70) setTimeout(fireConfetti, 150);
}
function downloadResultCard(){
  const s = state.studentInfo, ex = state.currentExam;
  const score = state.finalScore, correct = state.finalCorrect, total = state.finalTotal;
  const label = score>=90 ? "ISTIMEWA" : score>=70 ? "SANGAT BAIK" : score>=50 ? "CUKUP BAIK" : "PERLU BELAJAR LAGI";

  const canvas = document.createElement("canvas");
  const W = 1000, H = 1300;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  // background
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#071d47"); bg.addColorStop(1,"#0b3d91");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // decorative gold circles
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = "#d4a017";
  ctx.beginPath(); ctx.arc(W-60,80,180,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60,H-60,220,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // white card
  const pad = 60;
  ctx.fillStyle = "#ffffff";
  roundRect(ctx, pad, 220, W-pad*2, H-220-pad, 28); ctx.fill();

  // header text
  ctx.textAlign = "center";
  ctx.fillStyle = "#fbeecb";
  ctx.font = "600 26px Inter, sans-serif";
  ctx.fillText("SMKS CILEDUG AL-MUSADDADIYAH", W/2, 90);
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 44px Poppins, sans-serif";
  ctx.fillText("HASIL UJIAN ONLINE", W/2, 150);
  ctx.fillStyle = "#d4a017";
  ctx.font = "600 20px Inter, sans-serif";
  ctx.fillText(ex.title, W/2, 190);

  // body content
  let y = 300;
  ctx.fillStyle = "#5b6b8c";
  ctx.font = "500 22px Inter, sans-serif";
  ctx.fillText("Nama Peserta", W/2, y);
  y += 46;
  ctx.fillStyle = "#152238";
  ctx.font = "800 40px Poppins, sans-serif";
  ctx.fillText(s.nama, W/2, y);
  y += 40;
  ctx.fillStyle = "#5b6b8c";
  ctx.font = "500 20px Inter, sans-serif";
  ctx.fillText(`${s.kelas}${s.jurusan ? " · " + s.jurusan : ""}${s.prodi ? " · " + s.prodi : ""}`, W/2, y);
  if(s.ttl){
    y += 32;
    ctx.font = "400 17px Inter, sans-serif";
    ctx.fillText(`TTL: ${s.ttl}`, W/2, y);
  }

  // score circle
  const cx = W/2, cy = y+220, r = 140;
  const grad = ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  grad.addColorStop(0,"#0b3d91"); grad.addColorStop(1,"#d4a017");
  ctx.lineWidth = 18;
  ctx.strokeStyle = "#eef1f8";
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = grad;
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2, -Math.PI/2 + (Math.PI*2*(score/100)));
  ctx.lineCap = "round"; ctx.stroke();
  ctx.fillStyle = "#152238";
  ctx.font = "800 80px Poppins, sans-serif";
  ctx.fillText(String(score), cx, cy+28);

  y = cy + r + 70;
  ctx.fillStyle = "#0b3d91";
  ctx.font = "700 24px Poppins, sans-serif";
  ctx.fillText(`Benar ${correct} dari ${total} soal`, W/2, y);

  y += 55;
  const labelW = ctx.measureText(label).width + 60;
  ctx.fillStyle = "#fbeecb";
  roundRect(ctx, W/2 - (labelW/2), y-32, labelW, 46, 23); ctx.fill();
  ctx.fillStyle = "#a87a0c";
  ctx.font = "800 20px Poppins, sans-serif";
  ctx.fillText(label, W/2, y);

  y = H - pad - 40;
  ctx.fillStyle = "#5b6b8c";
  ctx.font = "400 16px Inter, sans-serif";
  const tgl = new Date().toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
  ctx.fillText(`Dikumpulkan pada ${tgl}`, W/2, y);

  const link = document.createElement("a");
  link.download = `hasil_ujian_${s.nama.replace(/\s+/g,"_")}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function viewStudentResult(){
  const s = state.finalScore;
  const label = s>=90 ? "Istimewa! 🌟" : s>=70 ? "Kerja Bagus! 👏" : s>=50 ? "Cukup Baik" : "Terus Semangat Belajar";
  const violations = state.violations||0;
  return `
  ${topbar("Hasil Ujian", null, "siswa")}
  <div class="container fadein result-hero">
    <div style="font-size:46px">${s>=70?"🏆":"✅"}</div>
    <p>Ujian selesai, ${esc(state.studentInfo.nama)}!</p>
    <div class="result-score">${state.finalScore}</div>
    <span class="pill gold">${label}</span>
    <p class="muted" style="margin-top:10px">Benar ${state.finalCorrect} dari ${state.finalTotal} soal</p>
    ${violations>0 ? `<p style="color:var(--danger);font-size:12px;font-weight:600">⚠ Terdeteksi ${violations}x keluar dari halaman ujian, tercatat untuk guru</p>` : ""}
    <button class="btn btn-gold" onclick="downloadResultCard()">⬇ Unduh Hasil Ujian</button>
    <div style="height:10px"></div>
    <button class="btn btn-primary" onclick="location.reload()">Selesai</button>
  </div>
  ${state.showQuoteModal ? `
  <div class="modal-overlay" onclick="if(event.target===this){state.showQuoteModal=false;render();}">
    <div class="modal-card fadein">
      <div class="modal-quote-icon">❝</div>
      <p class="modal-quote-text">${esc(state.quoteText)}</p>
      <button class="btn btn-primary" onclick="state.showQuoteModal=false;render()">Terima Kasih</button>
    </div>
  </div>` : ""}
  `;
}

/* ============================================================
   11) RENDER ROUTER
   ============================================================ */
function render(){
  if(state.view !== "exam") document.body.classList.remove("time-critical");
  const app = document.getElementById("app");
  const views = {
    home: viewHome, teacherLogin: viewTeacherLogin, teacherDash: viewTeacherDash,
    buildExam: viewBuildExam, examCreated: viewExamCreated, recap: viewRecap,
    studentJoin: viewStudentJoin, studentInfo: viewStudentInfo, studentPhoto: viewStudentPhoto, exam: viewExam,
    studentResult: viewStudentResult
  };
  app.innerHTML = (views[state.view] || viewHome)() + renderFAQModal() + renderPhotoModal();
  if(state.view === "studentPhoto" && !state.capturedPhoto) setTimeout(initCamera, 100);
  const td = document.getElementById("timerDisplay");
  if(td && state.timerEnd){
    const left = Math.max(0, state.timerEnd - Date.now());
    const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
    td.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }
}
render();
</script>
